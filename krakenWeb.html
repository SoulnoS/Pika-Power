<title>Kraken GIF Carousel + CPU Temp</title>
<style>
:root { --overlay-bg: rgba(0,0,0,0.55); --overlay-radius: 12px; --font: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
html, body { margin: 0; height: 100%; width: 100%; background: #000; color: #fff; font-family: var(--font); }


.stage { position: relative; height: 100vh; width: 100vw; overflow: hidden; display: grid; place-items: center; }


.carousel { position: absolute; inset: 0; display: grid; place-items: center; background: #000; }
.carousel img { position: absolute; max-width: none; opacity: 0; transition: opacity 500ms ease-in-out; width: 100vmin; height: 100vmin; object-fit: cover; object-position: center center; -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 68%, transparent 72%); mask-image: radial-gradient(circle at 50% 50%, #000 68%, transparent 72%); }
.carousel img.active { opacity: 1; }


/* Temp overlay: bottom-center (90%) */
.overlay { position: absolute; top: 90%; left: 50%; transform: translate(-50%, -50%); padding: 12px 20px; background: var(--overlay-bg); backdrop-filter: blur(4px); border-radius: var(--overlay-radius); border: 1px solid rgba(255,255,255,0.15); font-weight: 600; letter-spacing: 0.3px; display: inline-flex; align-items: baseline; gap: 8px; z-index: 5; }
.overlay .value { font-size: 48px; line-height: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #9ef89e; opacity: .85; align-self: center; }


.dev-banner { position: absolute; left: 10px; top: 10px; padding: 6px 10px; font-size: 11px; background: rgba(255,255,255,.08); border: 1px dashed rgba(255,255,255,.25); border-radius: 8px; opacity: .9; }
