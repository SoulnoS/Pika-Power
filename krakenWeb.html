<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="nzxt-version" content="1" />
  <title>Pika Power — NZXT Kraken</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;
      overflow: hidden;
    }
    .carousel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 50%, #0b0b0b 0%, #000 70%);
    }
    .carousel img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .carousel img.active {
      opacity: 1;
    }
    .temp {
      position: absolute;
      left: 50%;
      top: 90%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(0,0,0,.6);
    }
  </style>
</head>
<body>
  <div class="carousel" id="carousel"></div>
  <div class="temp" id="temp">--°C</div>

  <script>
    // Use Bruno's structure with your GIFs
    const params = new URLSearchParams(location.search);
    const interval = Math.max(1, parseInt(params.get('interval') || '15', 10));
    const GIFS = (params.get('gifs') ? params.get('gifs').split(',') : [
      'https://media1.tenor.com/m/38VcHi-BBD0AAAAd/pikachu-sleep.gif',
      'https://media1.tenor.com/m/3QHdpH8eVjIAAAAd/pikachu-drinking.gif',
      'https://media1.tenor.com/m/vUE_peSWrrwAAAAd/pikahappy.gif',
      'https://media1.tenor.com/m/ra-p_cC3O9YAAAAd/pikachu-pokemon.gif',
      'https://media1.tenor.com/m/pukZKNfe3JAAAAAd/laughing-pikachu.gif',
      'https://media1.tenor.com/m/ryHmkofn-4kAAAAd/pikachu-pokemon.gif',
      'https://media1.tenor.com/m/JQkWX-lI-b0AAAAd/pokemon-pikachu.gif',
      'https://media1.tenor.com/m/A4qhcUU5PQMAAAAC/pikachu-screaming.gif',
      'https://media.giphy.com/media/ubEwB9ZVYtfyg/giphy.gif',
      'https://media.giphy.com/media/qgkrtsDy4MhLq/giphy.gif',
      'https://media.giphy.com/media/12mwXD0A6E87L2/giphy.gif',
      'https://media.giphy.com/media/7SF5scGB2AFrgsXP63/giphy.gif',
      'https://media.giphy.com/media/dI4C6ZhNb3FBK/giphy.gif',
      'https://media.giphy.com/media/SeysxkSfenHY4/giphy.gif',
      'https://media.giphy.com/media/slVWEctHZKvWU/giphy.gif',
      'https://media.giphy.com/media/Era7aEMrYBvyg/giphy.gif',
      'https://media.giphy.com/media/dJYoOVAWf2QkU/giphy.gif'
    ]).filter(Boolean);

    const carousel = document.getElementById('carousel');
    const tempEl = document.getElementById('temp');

    const imgs = GIFS.map((src, i) => {
      const img = document.createElement('img');
      img.src = src.trim();
      if (i === 0) img.classList.add('active');
      img.addEventListener('error', () => img.remove());
      carousel.appendChild(img);
      return img;
    });

    let index = 0;
    if (imgs.length > 1) {
      setInterval(() => {
        const prev = imgs[index];
        index = (index + 1) % imgs.length;
        const next = imgs[index];
        prev && prev.classList.remove('active');
        next && next.classList.add('active');
      }, interval * 1000);
    }

    // --- NZXT Telemetry (exact structure from Bruno) ---
    const avgBuf = [];
    const pushAvg = (x) => {
      if (typeof x !== 'number' || !isFinite(x)) return null;
      avgBuf.push(x);
      if (avgBuf.length > 5) avgBuf.shift();
      return avgBuf.reduce((a, b) => a + b, 0) / avgBuf.length;
    };

    const pickTemp = (data) => {
      const paths = [data?.cpu?.package?.temperature, data?.cpu?.temperature, data?.cpus?.[0]?.package?.temperature, data?.cpus?.[0]?.temperature];
      for (const v of paths) if (typeof v === 'number' && isFinite(v)) return v;
      return null;
    };

    function onData(data) {
      const raw = pickTemp(data);
      const avg = pushAvg(raw);
      tempEl.textContent = avg == null ? '--°C' : `${Math.round(avg)}\u00B0C`;
    }

    function attachNZXT() {
      if (window.nzxt?.v1 && typeof window.nzxt.v1.onMonitoringDataUpdate === 'function') {
        window.nzxt.v1.onMonitoringDataUpdate = onData;
        return true;
      }
      if (window.nzxt && typeof window.nzxt.onMonitoringDataUpdate === 'function') {
        window.nzxt.onMonitoringDataUpdate = onData;
        return true;
      }
      return false;
    }

    window.addEventListener('nzxt', attachNZXT);
    window.addEventListener('DOMContentLoaded', attachNZXT);

    let tries = 0;
    const poll = setInterval(() => {
      if (attachNZXT() || tries++ > 250) clearInterval(poll);
    }, 200);
  </script>
</body>
</html>
