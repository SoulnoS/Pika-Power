<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="nzxt-version" content="1" />
  <title>Pika Power — NZXT Kraken</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;
      overflow: hidden;
    }
    .carousel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 50%, #0b0b0b 0%, #000 70%);
    }
    .carousel img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .4s ease;
    }
    .carousel img.active {
      opacity: 1;
    }

    /* Temp overlay: bottom-center (90%) */
    .overlay {
      position: absolute;
      top: 90%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 600;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      z-index: 5;
    }
    .overlay .value {
      font-size: 48px;
      line-height: 1;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ef89e;
      opacity: .85;
      align-self: center;
      transition: opacity .3s ease;
    }

    /* Centered debug text */
    #nzxtStatus {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font: 16px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;
      color: #9ef89e;
      text-align: center;
      white-space: pre-wrap;
      max-width: 90vw;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div id="carousel" class="carousel"></div>
  <div class="overlay" id="temp">
    <span class="value" id="tempVal">--°C</span>
    <span class="dot" id="tick"></span>
  </div>
  <div id="nzxtStatus">Waiting for NZXT…</div>

  <script>
    // ---------- 1) GIF playlist + rotation ----------
    const p = new URLSearchParams(location.search);
    const INTERVAL = Math.max(1, parseInt(p.get('interval') || '15', 10));
    const GIFS = (p.get('gifs') ? p.get('gifs').split(',') : [
      'https://media1.tenor.com/m/38VcHi-BBD0AAAAd/pikachu-sleep.gif',
      'https://media1.tenor.com/m/3QHdpH8eVjIAAAAd/pikachu-drinking.gif',
      'https://media1.tenor.com/m/vUE_peSWrrwAAAAd/pikahappy.gif',
      'https://media1.tenor.com/m/ra-p_cC3O9YAAAAd/pikachu-pokemon.gif',
      'https://media1.tenor.com/m/pukZKNfe3JAAAAAd/laughing-pikachu.gif',
      'https://media1.tenor.com/m/ryHmkofn-4kAAAAd/pikachu-pokemon.gif',
      'https://media1.tenor.com/m/JQkWX-lI-b0AAAAd/pokemon-pikachu.gif',
      'https://media1.tenor.com/m/A4qhcUU5PQMAAAAC/pikachu-screaming.gif',
      'https://media.giphy.com/media/ubEwB9ZVYtfyg/giphy.gif',
      'https://media.giphy.com/media/qgkrtsDy4MhLq/giphy.gif',
      'https://media.giphy.com/media/12mwXD0A6E87L2/giphy.gif',
      'https://media.giphy.com/media/7SF5scGB2AFrgsXP63/giphy.gif',
      'https://media.giphy.com/media/dI4C6ZhNb3FBK/giphy.gif',
      'https://media.giphy.com/media/SeysxkSfenHY4/giphy.gif',
      'https://media.giphy.com/media/slVWEctHZKvWU/giphy.gif',
      'https://media.giphy.com/media/Era7aEMrYBvyg/giphy.gif',
      'https://media.giphy.com/media/dJYoOVAWf2QkU/giphy.gif'
    ]).filter(Boolean);

    const car = document.getElementById('carousel');
    const imgs = GIFS.map((src, i) => {
      const el = document.createElement('img');
      el.src = src.trim();
      if (i === 0) el.classList.add('active');
      el.addEventListener('error', () => el.remove());
      car.appendChild(el);
      return el;
    });
    let idx = 0;
    if (imgs.length > 1) {
      setInterval(() => {
        const a = imgs[idx];
        idx = (idx + 1) % imgs.length;
        const b = imgs[idx];
        a && a.classList.remove('active');
        b && b.classList.add('active');
      }, INTERVAL * 1000);
    }

    // ---------- 2) Temp handling (with NZXT bridge) ----------
    const tempVal = document.getElementById('tempVal');
    const tick = document.getElementById('tick');
    const statEl = document.getElementById('nzxtStatus');
    const buf = [];
    const N = 5;
    const avgPush = (x) => {
      if (typeof x !== 'number' || !isFinite(x)) return null;
      buf.push(x);
      if (buf.length > N) buf.shift();
      return buf.reduce((a, b) => a + b, 0) / buf.length;
    };
    const pickTempC = (d) => {
      const c = [
        d?.cpu?.package?.temperature,
        d?.cpu?.temperature,
        d?.cpus?.[0]?.package?.temperature,
        d?.cpus?.[0]?.temperature,
      ];
      for (const v of c) if (typeof v === 'number' && isFinite(v)) return v;
      return null;
    };

    function onData(data) {
      if (!data || typeof data !== 'object') {
        statEl.textContent = 'Received empty data';
        return;
      }
      const avg = avgPush(pickTempC(data));
      tempVal.textContent = avg == null ? '--°C' : `${Math.round(avg)}\u00B0C`;
      tick.style.opacity = tick.style.opacity === '0.35' ? '0.85' : '0.35';
      statEl.textContent = 'Receiving NZXT data';
    }

    // Pre-register handlers before CAM injects
    window.nzxt = window.nzxt || {};
    window.nzxt.v1 = window.nzxt.v1 || {};
    window.nzxt.v1.onMonitoringDataUpdate = onData;
    if (!('onMonitoringDataUpdate' in window)) {
      window.onMonitoringDataUpdate = onData;
    }

    // Reattach if CAM overwrites after load
    window.addEventListener('nzxt', () => {
      try {
        if (window.nzxt?.v1)
          window.nzxt.v1.onMonitoringDataUpdate = onData;
      } catch {}
    });
  </script>
</body>
</html>
